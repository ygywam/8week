<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1764cb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>8주 루틴</title>
  <link rel="icon" href="/icon-v2.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon-v2-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png">
  <link rel="manifest" href="/manifest-v2.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <style>
    #first-visit-splash[hidden]{display:none}
    #first-visit-splash{position:fixed;inset:0;z-index:9999;background:#f3f8fe;pointer-events:none;opacity:1;transition:opacity .16s ease}
    #first-visit-splash img{width:100%;height:100%;display:block;object-fit:contain}
    #first-visit-splash.is-leaving{opacity:0}
    @media (prefers-reduced-motion:reduce){#first-visit-splash{transition:none}}
  </style>
  <script src="/config.js"></script>
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <div id="first-visit-splash" hidden aria-hidden="true"><img alt=""></div>
  <script>
    (() => {
      const splash = document.getElementById('first-visit-splash');
      const key = '8week-first-visit-intro-v1';
      try {
        if (!matchMedia('(max-width: 600px) and (orientation: portrait)').matches || localStorage.getItem(key)) return;
        localStorage.setItem(key, 'shown');
        splash.querySelector('img').src = '/splash-8-v1.svg';
        splash.hidden = false;
        setTimeout(() => {
          splash.classList.add('is-leaving');
          setTimeout(() => splash.remove(), 180);
        }, 1000);
      } catch (_) {
        // Storage may be unavailable in private or restricted browsing: never block the app.
        splash.remove();
      }
    })();
  </script>
  <div id="app"><div class="loading">불러오는 중…</div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="guide-root"></div>
</body>
</html>
