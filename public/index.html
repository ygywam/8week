<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1764cb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>8주 루틴</title>
  <link rel="icon" href="/icon-v2.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon-v2-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png">
  <link rel="manifest" href="/manifest-v2.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/splash.css">
  <script src="/config.js"></script>
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <dialog id="first-visit-splash" aria-labelledby="splash-title" aria-describedby="splash-description">
    <div class="splash-art">
      <h1 id="splash-title" class="splash-sr-only">8주 루틴</h1>
      <p id="splash-description" class="splash-sr-only">8주를, 나답게. 운동을 계획하고 하루씩 기록해요.</p>
      <img alt="" width="390" height="844">
    </div>
    <div class="splash-controls">
      <label class="splash-checkbox"><input type="checkbox" id="splash-hide-next"> <span>다시 안 보기</span></label>
      <p id="splash-error" role="alert" hidden></p>
      <button type="button" id="splash-confirm">확인</button>
    </div>
  </dialog>
  <script src="/splash.js"></script>
  <div id="app"><div class="loading">불러오는 중…</div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="guide-root"></div>
</body>
</html>
